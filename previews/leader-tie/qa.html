<!doctype html><meta charset="utf-8"><title>출발 동률 선두 QA</title><style>body{margin:0}iframe{width:100vw;height:100vh;border:0}nav{position:fixed;z-index:9;top:8px;left:8px}pre{position:fixed;bottom:0;left:0;background:#fffd;font:11px monospace;max-width:100%;max-height:20vh;overflow:auto}#evidence{display:none}</style><nav><button id="start">초기 설정 새 게임</button><button id="clean">캡처</button></nav><iframe id="game" src="../../index.html"></iframe><pre id="metrics"></pre><pre id="evidence"></pre><script>
const frame=document.getElementById('game');let app,w,data={};frame.onload=()=>{w=frame.contentWindow;app=w.CosmicPinball.app;const original=app.renderer.render.bind(app.renderer);app.renderer.render=state=>{original(state);if(state.status==='running'&&app.physics.time<4){const ranking=app.physics.getRanking(),standing=w.CosmicPinball.raceStanding(ranking);data.samples.push({time:app.physics.time,leader:state.leader?.id||null,expected:standing.leader?.id||null,tie:Math.abs(ranking[0].y-ranking[1].y)<=1e-7,ranks:standing.ranks,order:ranking.map(m=>m.id)});}};};
document.getElementById('start').onclick=()=>{app.reset('setup');const d=w.document;d.getElementById('names').value='귤*4,수박*2,키위*2';d.getElementById('seed').value='';d.getElementById('speed').value='1';d.getElementById('sound').checked=false;d.getElementById('start-button').click();data={seed:app.runSettings.seed,slots:app.physics.marbles.map(m=>[m.id,m.x,m.y]),samples:[]};};
document.getElementById('clean').onclick=()=>{document.querySelector('nav').style.display='none';document.getElementById('metrics').style.display='none';};
setInterval(()=>{if(!app)return;data.status=app.status;data.time=app.physics.time;data.visibleRanks=[...w.document.querySelectorAll('#live-ranking .rank-number')].map(n=>n.textContent);data.names=[...w.document.querySelectorAll('#live-ranking .rank-name')].map(n=>n.textContent);data.finished=app.physics.finished.map(m=>[m.id,m.finishTime]);document.getElementById('evidence').textContent=JSON.stringify(data);document.getElementById('metrics').textContent=JSON.stringify({...data,samples:data.samples?.slice(-1)});},40);
</script>

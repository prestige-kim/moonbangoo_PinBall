<!doctype html><meta charset="utf-8"><title>손 던지기 브라우저 QA</title>
<style>body{margin:0;background:#f4ecdc;font:11px sans-serif}iframe{display:block;width:100vw;height:100vh;border:0}nav{position:fixed;left:4px;top:4px;z-index:5;display:flex;gap:4px;flex-wrap:wrap;max-width:95vw;padding:5px;background:#fff7eedd;border-radius:6px}button,select{font-size:11px;padding:4px}#metrics{position:fixed;bottom:0;left:0;z-index:6;max-width:95vw;max-height:110px;overflow:auto;margin:0;padding:6px;background:#fff9eddf;white-space:pre-wrap;pointer-events:none;font-size:9px}#capture{display:none;position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#f4ecdc;z-index:4}</style>
<nav><select id="count"><option>6</option><option>50</option><option>200</option><option>500</option></select><button id="prepare">설정·시작</button><label><input id="reduced" type="checkbox">모션 감소</label><button data-trace="straight">직선</button><button data-trace="reverse">급반전</button><button data-trace="circle">원형</button><button data-trace="slow">느린 바깥</button><button data-trace="short">짧은 빠름</button><button data-trace="stop">멈춤 후 놓기</button><button data-trace="jitter">경계 흔들림</button><button data-trace="cancel">터치 취소</button><button data-trace="fast">바깥 던지기</button><select id="phase"><option value=".62">비행 .62</option><option value=".88">맵 진입 .88</option></select><button id="flight-capture">비행 캡처·던짐</button><button id="gold">금빛 경계 캡처</button><button id="show">라이브 보기</button></nav>
<iframe id="game" src="../../index.html"></iframe><img id="capture"><pre id="metrics">브라우저 렌더링 + 합성 PointerEvent QA. 실제 휴대폰 검사 아님.</pre>
<script type="application/json" id="evidence"></script><script>
const iframe=document.getElementById('game'),metrics=document.getElementById('metrics'),capture=document.getElementById('capture');
let app,win,canvas,data={},frames=[],cpu=[],actions=[],generation=0,busy=false,initialOrder='',initialCollisions=0,pendingCapture=false,goldSource=null;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function attach(){win=iframe.contentWindow;app=win.CosmicPinball.app;canvas=win.document.getElementById('cinema-canvas');const captureNative=canvas.setPointerCapture.bind(canvas),releaseNative=canvas.releasePointerCapture.bind(canvas);canvas.setPointerCapture=id=>{if(id!==999)captureNative(id);};canvas.releasePointerCapture=id=>{if(id!==999)releaseNative(id);};const renderFlight=app.handFlight.render.bind(app.handFlight);app.handFlight.render=state=>{const result=renderFlight(state);app.handFlight.qaProgress=state.progress;if(state.progress===1){let error=0;for(const pose of app.handFlight.lastPoses){const m=app.physics.marbles.find(m=>m.id===pose.id),target=app.camera.worldToScreen(m.x,m.y);error=Math.max(error,Math.hypot(pose.x-target.x,pose.y-target.y),Math.abs(pose.radius-m.r*app.camera.zoom));}data.mapEndpoint={count:app.handFlight.lastPoses.length,uniqueIDs:new Set(app.handFlight.lastPoses.map(p=>p.id)).size,maxPixelError:error};}return result;};const callbacks=app.shuffleInput.callbacks,begin=callbacks.begin,move=callbacks.move,release=callbacks.release;let native=false;callbacks.begin=point=>{native=app.shuffleInput.active!==999;if(native)data.nativeGesture={samples:1,start:point,collisionsBefore:app.handScene.shuffle.collisions};begin(point);};callbacks.move=point=>{if(native)data.nativeGesture.samples++;move(point);};callbacks.release=point=>{release(point);if(native){data.nativeGesture.end=point;data.nativeGesture.collisions=app.handScene.shuffle.collisions-data.nativeGesture.collisionsBefore;data.nativeGesture.decision=app.handScene.lastDecision;native=false;}};const update=app.handScene.update.bind(app.handScene);app.handScene.update=dt=>{const start=performance.now();update(dt);if(app.handScene.elapsed>1)cpu.push(performance.now()-start);};}
iframe.onload=attach;
function pointer(type,x,y){const area=app.handScene.area();const event=new win.PointerEvent(type,{pointerId:999,pointerType:'touch',isPrimary:true,button:0,buttons:type==='pointerup'||type==='pointercancel'?0:1,bubbles:true,cancelable:true,clientX:area.x+x*area.s,clientY:area.y+y*area.s});canvas.dispatchEvent(event);}
function order(){return app.handScene.shuffle.bodies.slice().sort((a,b)=>a.x-b.x).map(b=>b.id).join(',');}
function audit(){const bodies=app.handScene.shuffle.bodies;let overlap=0;for(let i=0;i<bodies.length;i++)for(let j=0;j<i;j++){const a=bodies[i],b=bodies[j];overlap=Math.max(overlap,(a.r+b.r-Math.hypot(a.x-b.x,a.y-b.y))/(a.r+b.r));}return {worstOverlap:overlap,uniqueIDs:new Set(bodies.map(b=>b.id)).size,positionExchange:order()!==initialOrder,collisions:app.handScene.shuffle.collisions-initialCollisions};}
function summary(){const sorted=frames.slice().sort((a,b)=>a-b),sCPU=cpu.slice().sort((a,b)=>a-b);return {samples:frames.length,averageFPS:frames.length?1000/(frames.reduce((a,b)=>a+b,0)/frames.length):0,p95FrameMs:sorted[Math.floor(sorted.length*.95)]||0,maxFrameMs:sorted.at(-1)||0,meanShuffleCPUms:cpu.length?cpu.reduce((a,b)=>a+b,0)/cpu.length:0,p95ShuffleCPUms:sCPU[Math.floor(sCPU.length*.95)]||0};}
function publish(){data.scene=app.status;data.physicsTime=app.physics.time;data.finished=app.physics.finished.length;data.viewport=[win.innerWidth,win.innerHeight];data.count=app.physics.marbles.length;data.reduced=app.settings.reducedMotion;data.performance=summary();data.actions=actions;document.getElementById("evidence").textContent=JSON.stringify(data);const visible={...data};for(const key of ["startIDs","flightStartIDs","slots","finishOrder"])delete visible[key];visible.flightIDsMatch=data.flightStartIDs?JSON.stringify(data.startIDs)===JSON.stringify(data.flightStartIDs):null;visible.finishIDsMatch=data.finishOrder?new Set(data.finishOrder.map(m=>m[0])).size===data.count:null;visible.first8=data.finishOrder?data.finishOrder.slice(0,8):null;visible.lastArrival=data.finishOrder?data.finishOrder.at(-1)[1]:null;metrics.textContent=JSON.stringify(visible);}
document.getElementById('prepare').onclick=async()=>{if(busy)return;capture.style.display='none';generation++;app.reset('setup');const doc=win.document;doc.getElementById('names').value='핀볼*'+document.getElementById('count').value;doc.getElementById('seed').value='HAND-QA-'+document.getElementById('count').value;doc.getElementById('speed').value='3';doc.getElementById('sound').checked=false;doc.getElementById('reduced-motion').checked=document.getElementById('reduced').checked;doc.getElementById('names').dispatchEvent(new win.Event('input',{bubbles:true}));doc.getElementById('start-button').click();frames=[];cpu=[];actions=[];data={};goldSource=null;initialOrder=order();initialCollisions=0;await wait(900);data.startIDs=app.handScene.shuffle.bodies.map(b=>b.id);publish();};
async function trace(kind){if(busy||app.status!=='mixing'||app.handScene.elapsed<.8)return;busy=true;const start=performance.now(),before=order(),collisions=app.handScene.shuffle.collisions;let exchanged=false,x=0,y=0;pointer('pointerdown',kind==='short'?.24:kind==='circle'?.12:kind==='straight'?-.12:0,kind==='straight'?.025:0);let duration=kind==='fast'||kind==='stop'?90:kind==='short'?35:kind==='slow'?1400:kind==='jitter'?1400:1600;for(let elapsed=0;elapsed<=duration;elapsed+=16){const t=Math.min(1,elapsed/duration);if(kind==='fast'||kind==='stop')x=.38*t;else if(kind==='short')x=.24+.17*t;else if(kind==='slow')x=.34*t;else if(kind==='circle'){x=.12*Math.cos(t*Math.PI*6);y=.12*Math.sin(t*Math.PI*6);}else if(kind==='reverse'||kind==='cancel')x=.13*Math.sin(t*Math.PI*8);else if(kind==='jitter')x=t<.7?.24*t/.7:.24+.012*Math.sin(t*100);else {x=-.12+.30*t;y=.025;}pointer('pointermove',x,y);await wait(16);if(order()!==before)exchanged=true;}if(kind==='fast'||kind==='stop'){x=.38;pointer('pointermove',x,y);}if(kind==='short'){x=.41;pointer('pointermove',x,y);}if(kind==='stop')await wait(180);pointer(kind==='cancel'?'pointercancel':'pointerup',x,y);pointer('pointerup',x,y);const gate=app.throwGate.evaluate(performance.now());actions.push({kind,elapsed:performance.now()-start,scene:app.status,positionExchange:exchanged||order()!==before,collisions:app.handScene.shuffle.collisions-collisions,decision:kind==='cancel'?gate:app.handScene.lastDecision||app.handScene.launchDecision||gate});data.audit=audit();if(app.status==='flight'){data.flightStartIDs=app.handFlight.items.map(b=>b.id);data.slots=app.physics.marbles.map(m=>[m.id,m.x,m.y,m.vx,m.vy]);}busy=false;publish();}
for(const button of document.querySelectorAll('[data-trace]'))button.onclick=()=>trace(button.dataset.trace);
document.getElementById('flight-capture').onclick=async()=>{pendingCapture=true;await trace('fast');};document.getElementById('gold').onclick=()=>{if(goldSource){capture.src=goldSource;capture.style.display='block';}};document.getElementById('show').onclick=()=>{capture.style.display='none';pendingCapture=false;};
let previous=0,lastPublish=0;function tick(timestamp){if(app){if(app.status==='mixing'&&canvas.dataset.throwReady==='true'&&app.shuffleInput.active!==null){goldSource=canvas.toDataURL('image/png');data.goldCaptured=true;}if(app.status==='mixing'&&app.handScene.elapsed>1&&previous)frames.push(timestamp-previous);if(app.status==='flight'&&pendingCapture&&app.handFlight.lastPoses.length){const pose=app.handFlight.lastPoses[0],item=app.handFlight.items[0];if(app.handFlight.qaProgress>=Number(document.getElementById('phase').value)){capture.src=canvas.toDataURL('image/png');capture.style.display='block';pendingCapture=false;data.capture='actual browser flight frame';data.captureProgress=app.handFlight.qaProgress;}}if(app.status==='finished'&&!data.finishOrder)data.finishOrder=app.physics.finished.map(m=>[m.id,m.finishTime]);if(timestamp-lastPublish>250){publish();lastPublish=timestamp;}}previous=timestamp;requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script>

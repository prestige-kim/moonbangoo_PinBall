<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>발사 전환 로컬 시안</title><style>*{box-sizing:border-box}body{margin:0;background:#eee6d7;color:#4a3a28;font:14px system-ui}header{padding:16px 24px;background:#fbf7ef;border-bottom:1px solid #c7b692}h1{font-size:20px;margin:0 0 10px}p{margin:8px 0;line-height:1.6}button,select,input{font:inherit;padding:7px 12px;margin:3px;border:1px solid #bc9a5e;border-radius:7px;background:#fffaf0;color:inherit}input{padding:0;width:160px;vertical-align:middle}a{color:#7a5520}.frame{display:flex;justify-content:center}iframe{width:100%;height:calc(100vh - 190px);min-height:580px;border:0;background:#f4ede0}.note{color:#806d51;font-size:12px}#status{font-weight:600}@media(max-width:700px){header{padding:12px}iframe{height:844px;min-height:0}}</style><header><h1>셔플 → 놀이판 전환 · 별도 로컬 시안</h1><div><select id="map"><option value="classic">연못 정원</option><option value="twinfold">바람 도서관</option><option value="cascade">빗살 협곡</option><option value="rhythm">태엽 공장</option></select><select id="variant"><option value="proposal">제안 시안</option><option value="baseline">현재 전환</option></select><button id="reset">입력부터 다시</button><button id="play" disabled>전환 재생</button><input id="progress" type="range" min="0" max="1" step=".001" value="0" disabled><span id="time">0%</span> · <a href="index.html">맵별 비교 영상</a> · <a href="../../">원본 게임</a></div><p id="status">불러오는 중…</p><p class="note">아래에서 게임 시작 → 통을 기울여 붓기 → 공을 셔플한 뒤 오른쪽 위로 밀어 발사하세요. 발사 직후 검토용으로 정지합니다. 같은 출발 상태에서 현재/시안을 전환·재생할 수 있습니다. 경기 계산은 멈춘 상태입니다. 루트 게임에는 적용하지 않았습니다.</p></header><div class="frame"><iframe id="game" title="전환 시안 검토용 게임"></iframe></div><script>
const $=id=>document.getElementById(id),frame=$('game');let animation=0;
function review(){return frame.contentWindow.FlightReview;}function seek(p){const lab=review();if(!lab?.state)return;lab.seek(p);$('progress').value=p;$('time').textContent=Math.round(p*100)+'%';}
function reset(){cancelAnimationFrame(animation);$('play').disabled=true;$('progress').disabled=true;$('status').textContent='설정 중…';frame.src='../../index.html?flight-lab='+Date.now();}
frame.onload=async()=>{const w=frame.contentWindow;async function script(path){return new Promise((ok,no)=>{const s=w.document.createElement('script');s.src=new URL(path,location.href).href;s.onload=ok;s.onerror=no;w.document.head.append(s);});}try{await script('../../qa/flight-transition/prototype.js');await script('../../qa/flight-transition/review.js');const a=w.CosmicPinball.app;review().capture=true;review().select($('variant').value);w.document.getElementById('intro-start-button').click();w.document.querySelector('[data-map="'+$('map').value+'"]').click();const u=a.ui;u.load({...u.readSettings(),names:'빨강*17,초록*17,파랑*16',seed:'transition-lab',sound:false,speed:1});u.emit('change',u.readSettings());$('status').textContent='게임을 시작하고 공을 발사하면 비교 준비가 됩니다.';const timer=setInterval(()=>{if(frame.contentWindow!==w){clearInterval(timer);return;}if(review()?.state&&review().pause){clearInterval(timer);$('play').disabled=false;$('progress').disabled=false;$('status').textContent='비교 준비 완료 · 동일한 출발 상태입니다.';seek(0);}},100);}catch(e){$('status').textContent='불러오기 실패: '+e.message;}};
$('variant').onchange=()=>{cancelAnimationFrame(animation);if(review()){review().select($('variant').value);if(review().state)seek(+$('progress').value);}};$('map').onchange=reset;$('reset').onclick=reset;$('progress').oninput=()=>{cancelAnimationFrame(animation);seek(+$('progress').value);};$('play').onclick=()=>{cancelAnimationFrame(animation);if(!review()?.state)return;const duration=frame.contentWindow.CosmicPinball.app.handFlight.duration*1000,start=performance.now();function tick(now){const p=Math.min(1,(now-start)/duration);seek(p);if(p<1)animation=requestAnimationFrame(tick);}animation=requestAnimationFrame(tick);};reset();
</script></html>

<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>맵별 배경·장면 적용 미리보기</title><style>*{box-sizing:border-box}body{margin:0;padding:30px;background:#eee7dc;color:#43392d;font:15px system-ui}header,main{max-width:1440px;margin:auto}h1{font-size:30px;margin:0 0 12px}header p{line-height:1.7;color:#796852}.maps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:26px 0}.map{padding:0;border:2px solid transparent;border-radius:16px;overflow:hidden;background:#fbf7ef;cursor:pointer;color:inherit;text-align:left}.map.active{border-color:#ac8352}.map img{width:100%;height:220px;object-fit:cover;display:block}.map b,.map span{display:block;margin:13px 15px}.map span{font-size:12px;color:#796852;line-height:1.5;min-height:36px}.scenes{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}button.scene{padding:10px 18px;border:1px solid #c4b397;border-radius:22px;background:#fbf7ef;color:#655039;cursor:pointer}.scene.active{background:#dec08a}.frame{border-radius:16px;overflow:hidden;border:1px solid #c4b397;background:#fbf7ef}.frame img{width:100%;display:block}small{display:block;margin-top:15px;color:#796852}@media(max-width:700px){body{padding:16px}.maps{grid-template-columns:1fr 1fr}.map img{height:160px}h1{font-size:24px}}</style><header><h1>맵마다 다른 풍경, 자연스럽게 이어지는 장면</h1><p>맵을 고르고 장면을 바꿔 실제 화면을 확인할 수 있습니다. 배경은 비충돌 장식이며 기존 장애물·경기 물리는 유지했습니다.</p></header><main><div class="maps" id="maps"></div><div class="scenes" id="scenes"></div><div class="frame"><a id="full"><img id="screen" alt="선택한 맵의 실제 장면"></a></div><small>로컬 검토용 화면입니다. 배포하지 않았습니다. 모바일 항목은 390px 폭 에뮬레이션입니다.</small></main><script>
const data=[['classic','연못 정원','연꽃·갈대·돌·잉어'],['twinfold','바람 도서관','서가·사다리·양피지·창가'],['cascade','빗살 협곡','층리·광맥·화석·건조 식물'],['rhythm','태엽 공장','톱니·배관·계기·청록 도관']],stages=[['setup','선택·준비'],['mixing','붓기·셔플'],['flight','발사 전환'],['running','경기'],['finished','결과'],['mobile-setup','모바일 준비']];let map='classic',scene='setup';for(const[id,name,detail]of data){const b=document.createElement('button');b.className='map';b.dataset.id=id;b.innerHTML='<img src="../../assets/backgrounds/'+id+'-background-v1.png" alt="'+name+' 생성 배경"><b>'+name+'</b><span>'+detail+'</span>';b.onclick=()=>{map=id;update();};document.getElementById('maps').append(b);}for(const[id,name]of stages){const b=document.createElement('button');b.className='scene';b.dataset.id=id;b.textContent=name;b.onclick=()=>{scene=id;update();};document.getElementById('scenes').append(b);}function update(){document.querySelectorAll('.map').forEach(b=>b.classList.toggle('active',b.dataset.id===map));document.querySelectorAll('.scene').forEach(b=>b.classList.toggle('active',b.dataset.id===scene));const src=map+'-'+scene+'.png';document.getElementById('screen').src=src;document.getElementById('full').href=src;}update();
</script></html>

<!doctype html><html lang="ko"><meta charset="utf-8"><title>맵별 장애물 이미지 보강 비교</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#efe9dd;color:#423b32;font:15px system-ui}header,main{max-width:1400px;margin:auto}h1{margin:0 0 10px;font-size:28px}header p{line-height:1.7;margin:0 0 26px;color:#74624f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:30px}article{border-radius:18px;overflow:hidden;background:white;border:1px solid #d1c5b2}h2{font-size:19px;margin:20px 22px 6px}article p{margin:0 22px 15px;color:#736653;font-size:13px}canvas{display:block;width:100%}button{float:right;padding:10px 16px;border-radius:20px;border:1px solid #ac9479;background:#fff9ec;color:#564834}</style><header><button id="pause">일시정지</button><h1>맵마다 다른 재질, 단단한 장애물</h1><p>동일한 충돌체와 같은 시각의 변경 전·후 비교입니다. 지형·장애물 크기·경기 물리는 유지하고 생성 이미지의 질감과 입체 테두리를 적용했습니다.</p></header><main id="maps"></main>
<script src="../../js/maps.js"></script><script src="../../js/map-registry.js"></script><script src="../../js/maps/twinfold.js"></script><script src="../../js/maps/twinfold-style.js"></script><script src="../../js/maps/cascade.js"></script><script src="../../js/maps/cascade-style.js"></script><script src="../../js/maps/rhythm.js"></script><script src="../../js/maps/rhythm-style.js"></script><script src="../../js/physics.js"></script><script src="../../js/themes.js"></script><script src="renderer-before.js"></script><script>const Before=CosmicPinball.Renderer;</script><script src="../../js/renderer.js"></script><script>
const P=CosmicPinball,scenes=[['classic','연못 정원','대나무·옥빛 수면·황동',1600],['twinfold','바람 도서관','호두나무·가죽·황동',950],['cascade','빗살 협곡','층리 사암·구리',1700],['rhythm','태엽 공장','황동·청록 에나멜',1300]],panels=[];let paused=false,time=0,previous=0;document.getElementById('pause').onclick=()=>paused=!paused;
for(const [id,name,material,top]of scenes){const title=document.createElement('h2');title.textContent=name;document.getElementById('maps').append(title);const grid=document.createElement('div');grid.className='grid';document.getElementById('maps').append(grid);for(const after of [false,true]){const box=document.createElement('article');box.innerHTML='<h2>'+(after?'이미지 보강 후':'기존 표현')+'</h2><p>'+material+'</p><canvas width="1000" height="1000"></canvas>';grid.append(box);const c=box.querySelector('canvas'),ctx=c.getContext('2d'),r=Object.assign(Object.create((after?P.Renderer:Before).prototype),{ctx,mapStyle:P.MAP_STYLES[id],theme:P.THEMES.cosmic,reducedMotion:false,quality:'high',currentZoom:1,dpr:1,sprites:new Map()});panels.push({id,top,c,ctx,r,p:new P.Physics({map:P.MAPS[id],names:P.parseNames('공')}),after});}}
function frame(ms){if(previous&&!paused)time+=(ms-previous)/1000;previous=ms;for(const v of panels){const{ctx,r,c,p,top}=v;p.time=time;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=r.mapStyle.board;ctx.fillRect(0,0,c.width,c.height);ctx.save();ctx.translate(0,-top);ctx.save();ctx.translate(0,top);r.mapPattern(ctx,1000,1000,true);ctx.restore();ctx.strokeStyle=r.mapStyle.accent;ctx.lineWidth=2;for(const x of [36,964]){ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,top+1000);ctx.stroke();}for(const o of p.map.obstacles)r.drawObstacle(o,p,null,time,{top,bottom:top+1000});ctx.restore();}requestAnimationFrame(frame);}requestAnimationFrame(frame);window.artPanels=panels;
</script></html>

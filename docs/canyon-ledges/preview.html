<!doctype html><html lang="ko"><meta charset="utf-8"><title>빗살 협곡 — 바위턱 추가</title><style>*{box-sizing:border-box}body{margin:0;padding:26px;background:#B77755;color:#FFF0DD;font-family:system-ui,sans-serif}header{max-width:1400px;margin:auto auto 20px}small{letter-spacing:.15em}h1{font-size:26px;margin:8px 0}p{font-size:13px;line-height:1.6;margin:0}main{display:flex;gap:18px;max-width:1400px;margin:auto}section{flex:1;min-width:0;border:1px solid #A76546;border-radius:18px;overflow:hidden;background:#F3D5B8}h2{font-size:18px;margin:20px 20px 6px}section p{margin:0 20px 12px}canvas{display:block;width:100%;height:auto}button{float:right;border:1px solid #A76546;border-radius:20px;padding:10px 18px;background:#F3D5B8;color:#FFF0DD}</style><header><button id="pause">일시정지</button><small>빗살 협곡 · 실제 지형 미리보기</small><h1>빗살 사이에서 튀어 오르는 바위턱</h1><p>짧은 바위턱과 벽에 붙은 바위턱이 엇갈리며 긴 낙하를 끊습니다.</p></header><main><section><h2>01 첫 바위턱</h2><p>빗살 아래에서 짧은 경사 턱에 부딪힙니다.</p><canvas id="drum" width="900" height="1120"></canvas></section><section><h2>02 벽 쪽 반동 구간</h2><p>벽을 따라 떨어지던 공을 다시 안쪽으로 튕깁니다.</p><canvas id="routes" width="900" height="1120"></canvas></section><section><h2>03 다음 빗살로 연결</h2><p>빗살·경사로·바위턱을 번갈아 통과합니다.</p><canvas id="finale" width="900" height="1120"></canvas></section></main><script src="../../js/maps.js"></script><script src="../../js/map-registry.js"></script><script src="../../js/maps/cascade.js"></script><script src="../../js/maps/cascade-style.js"></script><script src="../../js/physics.js"></script><script src="../../js/themes.js"></script><script src="../../js/renderer.js"></script><script>
const P=CosmicPinball,map=P.MAPS.cascade,p=new P.Physics({map,names:P.parseNames('공')});let paused=false,elapsed=0,previous=0;document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'재생':'일시정지'};
function frame(ms){if(previous&&!paused)elapsed+=(ms-previous)/1000;previous=ms;p.time=elapsed;
 for(const[id,top]of [['drum',1500],['routes',2600],['finale',3600]]){const c=document.getElementById(id),ctx=c.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.translate(25,15);ctx.scale(.85,.85);ctx.translate(0,-top);const r=Object.assign(Object.create(P.Renderer.prototype),{ctx,mapStyle:P.MAP_STYLES.cascade,theme:P.THEMES.cosmic,reducedMotion:false,quality:'high'});ctx.save();ctx.translate(0,top);r.mapPattern(ctx,1000,1400,true);ctx.restore();ctx.strokeStyle='#A76546';ctx.lineWidth=3;for(const x of[36,964]){ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,top+1400);ctx.stroke();}for(const o of map.obstacles)r.drawObstacle(o,p,null,p.time,{top:top,bottom:top+1290});ctx.restore();}
 requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>

<!doctype html><html lang="ko"><meta charset="utf-8"><title>박자 분배기 — 세 가지 리듬 장치</title><style>*{box-sizing:border-box}body{margin:0;padding:26px;background:#c4d4e1;color:#29445f;font-family:system-ui,sans-serif}header{max-width:1400px;margin:auto auto 20px}small{letter-spacing:.15em}h1{font-size:26px;margin:8px 0}p{font-size:13px;line-height:1.6;margin:0}main{display:flex;gap:18px;max-width:1400px;margin:auto}section{flex:1;min-width:0;border:1px solid #7894ac;border-radius:18px;overflow:hidden;background:#ecf3f9}h2{font-size:18px;margin:20px 20px 6px}section p{margin:0 20px 12px}canvas{display:block;width:100%;height:auto}button{float:right;border:1px solid #7894ac;border-radius:20px;padding:10px 18px;background:#ecf3f9;color:#29445f}</style><header><button id="pause">일시정지</button><small>박자 분배기 · 실제 충돌 지형과 같은 동작</small><h1>모으고, 엇갈리고, 나누는 리듬</h1><p>표시등과 장애물은 같은 물리 시계를 사용합니다. 아래 화면은 세 구간의 장치 확대 미리보기입니다.</p></header><main><section><h2>01 교대 셔터</h2><p>좌우가 번갈아 펼쳐지며 공의 흐름을 나눕니다.</p><canvas id="shutter" width="900" height="1120"></canvas></section><section><h2>02 엇박 회전 패들</h2><p>서로 반대로 회전하며 도착 간격을 흔듭니다.</p><canvas id="paddle" width="900" height="1120"></canvas></section><section><h2>03 연쇄 게이트</h2><p>0.8초 시차로 열리는 4단계 중 1·2단계입니다.</p><canvas id="chain" width="900" height="1120"></canvas></section></main><script src="../../../js/maps.js"></script><script src="../../../js/map-registry.js"></script><script src="../../../js/maps/rhythm.js"></script><script src="../../../js/maps/rhythm-style.js"></script><script src="../../../js/physics.js"></script><script src="../../../js/themes.js"></script><script src="../../../js/renderer.js"></script><script>
const P=CosmicPinball,map=P.MAPS.rhythm,p=new P.Physics({map,names:P.parseNames('공')});let paused=false,elapsed=0,previous=0;document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'재생':'일시정지'};
function frame(ms){if(previous&&!paused)elapsed+=(ms-previous)/1000;previous=ms;p.time=elapsed;
 for(const[id,top]of [['shutter',1510],['paddle',3940],['chain',7650]]){const c=document.getElementById(id),ctx=c.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.translate(25,15);ctx.scale(.85,.85);ctx.translate(0,-top);const r=Object.assign(Object.create(P.Renderer.prototype),{ctx,mapStyle:P.MAP_STYLES.rhythm,theme:P.THEMES.cosmic,reducedMotion:false,quality:'high'});ctx.save();ctx.translate(0,top);r.mapPattern(ctx,1000,1400,true);ctx.restore();ctx.strokeStyle='#7894ac';ctx.lineWidth=3;for(const x of[36,964]){ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,top+1400);ctx.stroke();}for(const o of map.obstacles)r.drawObstacle(o,p,null,p.time,{top:top,bottom:top+1290});ctx.restore();}
 requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>

<!doctype html><html lang="ko"><meta charset="utf-8"><title>갈래 서가 바람 장치 디자인 검증</title><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#e4d7bd;color:#375e51;font-family:system-ui,sans-serif}header{max-width:1280px;margin:0 auto 22px}small{letter-spacing:.16em;color:#917748}h1{font-size:27px;margin:8px 0}header p{font-size:14px;margin:0;color:#716e55}main{display:flex;gap:24px;max-width:1280px;margin:auto}section{flex:1;min-width:0;background:#f4eddc;border:1px solid #c1b18b;border-radius:20px;overflow:hidden;box-shadow:0 12px 30px #6c573d12}h2{font-size:16px;padding:20px 26px 0;margin:0}canvas{display:block;width:100%;height:auto}button{border:1px solid #7f9c83;background:#eaf0dc;color:#385e50;border-radius:20px;padding:9px 16px;float:right;cursor:pointer}</style><header><button id="animate">주기 애니메이션 보기</button><small>갈래 서가 · 바람 장치</small><h1>서가의 숨결</h1><p>실제 게임의 송풍구 렌더링 · 분출 대기와 상승 기류 비교</p></header><main><section><h2>분출 대기 · 압력 충전</h2><canvas width="1520" height="1080" id="idle"></canvas></section><section><h2 id="gust-title">분출 중 · 상승과 좌우 확산</h2><canvas width="1520" height="1080" id="gust"></canvas></section></main><script src="../../../js/maps.js"></script><script src="../../../js/map-registry.js"></script><script src="../../../js/maps/twinfold.js"></script><script src="../../../js/physics.js"></script><script src="../../../js/renderer.js"></script><script>
const P=CosmicPinball,base=P.MAPS.twinfold.obstacles.find(o=>o.type==='wind');let animate=false;document.getElementById('animate').onclick=()=>{animate=!animate;document.getElementById('gust-title').textContent=animate?'2초 주기 · 분출과 대기':'분출 중 · 상승과 좌우 확산';document.getElementById('animate').textContent=animate?'두 상태 비교하기':'주기 애니메이션 보기'};
function frame(ms){for(const [id,time]of [['idle',3.78],['gust',2.17]]){const c=document.getElementById(id),ctx=c.getContext('2d');ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,760,540);ctx.strokeStyle='rgba(139,117,73,.06)';ctx.lineWidth=1;for(let y=70;y<520;y+=52){ctx.beginPath();ctx.moveTo(24,y);ctx.lineTo(736,y);ctx.stroke();for(let x=35;x<735;x+=31){ctx.strokeRect(x,y-25,17,25);}}const r=Object.assign(Object.create(P.Renderer.prototype),{ctx,quality:'high',reducedMotion:false});r.drawWind({...base,x:380,y:432},{time:animate&&id==='gust'?ms/1000:time});}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>

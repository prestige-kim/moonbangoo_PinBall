<!doctype html><html lang="ko"><meta charset="utf-8"><title>빗살 낙하 — 개폐 장치</title><style>*{box-sizing:border-box}body{margin:0;padding:30px;background:#e8c3a7;color:#754d37;font-family:system-ui,sans-serif}header{margin:0 auto 20px;max-width:1280px}small{letter-spacing:.16em;color:#926b47}h1{font-size:26px;margin:8px 0}p{margin:0;font-size:14px}main{display:flex;gap:24px;max-width:1280px;margin:auto}section{flex:1;min-width:0;background:#fff0dd;border:1px solid #c69c72;border-radius:20px;overflow:hidden}h2{font-size:16px;padding:18px 24px 0;margin:0}canvas{display:block;width:100%;height:auto}button{float:right;padding:9px 16px;border:1px solid #a6754f;background:#f5debd;color:#754d37;border-radius:20px;cursor:pointer}</style><header><button id="animate">개폐 애니메이션 보기</button><small>빗살 낙하 · 여섯 구간에 설치 · 4초 주기</small><h1>양쪽에서 펼쳐지는 대각 빗살</h1><p>실제 충돌 지형과 같은 위치로 그린 장치 · 양쪽 빗살이 엇갈려 직선 길을 막고 다시 열립니다</p></header><main><section><h2>닫힘 · 가로 전폭의 낙하길 차단</h2><canvas id="closed" width="1520" height="1320"></canvas></section><section><h2 id="state">열림 · 벽 밖으로 빗살 회수</h2><canvas id="open" width="1520" height="1320"></canvas></section></main><script src="../../../js/maps.js"></script><script src="../../../js/map-registry.js"></script><script src="../../../js/maps/cascade.js"></script><script src="../../../js/maps/cascade-style.js"></script><script src="../../../js/physics.js"></script><script src="../../../js/themes.js"></script><script src="../../../js/renderer.js"></script><script>
const P=CosmicPinball,map=P.MAPS.cascade,p=new P.Physics({map,names:P.parseNames('공')});let animate=false;document.getElementById('animate').onclick=()=>{animate=!animate;document.getElementById('animate').textContent=animate?'닫힘·열림 비교 보기':'개폐 애니메이션 보기';document.getElementById('state').textContent=animate?'4초 주기 개폐 애니메이션':'열림 · 벽 밖으로 빗살 회수'};
function frame(ms){for(const[id,time]of [['closed',1],['open',3]]){const c=document.getElementById(id),ctx=c.getContext('2d');ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,760,660);ctx.save();ctx.translate(70,32);ctx.scale(.62,.62);ctx.translate(0,-1430);ctx.strokeStyle='rgba(173,113,67,.1)';ctx.lineWidth=1;for(let y=1450;y<2450;y+=90){ctx.beginPath();ctx.moveTo(36,y);ctx.lineTo(964,y);ctx.stroke();}ctx.strokeStyle='#BF956A';ctx.lineWidth=5;for(const x of [36,964]){ctx.beginPath();ctx.moveTo(x,1430);ctx.lineTo(x,2500);ctx.stroke();}p.time=animate&&id==='open'?ms/1000:time;const r=Object.assign(Object.create(P.Renderer.prototype),{ctx,mapStyle:P.MAP_STYLES.cascade,theme:P.THEMES.cosmic,reducedMotion:false,quality:'high'});for(const o of map.obstacles)r.drawObstacle(o,p,null,p.time,{top:1430,bottom:2460});ctx.restore();}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>

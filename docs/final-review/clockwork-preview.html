<!doctype html><html lang="ko"><meta charset="utf-8"><title>태엽 공장 — 기계식 리듬 공장</title><style>*{box-sizing:border-box}body{margin:0;padding:26px;background:#30263F;color:#F4DDB9;font-family:system-ui,sans-serif}header{max-width:1400px;margin:auto auto 20px}small{letter-spacing:.15em}h1{font-size:26px;margin:8px 0}p{font-size:13px;line-height:1.6;margin:0}main{display:flex;gap:18px;max-width:1400px;margin:auto}section{flex:1;min-width:0;border:1px solid #886C83;border-radius:18px;overflow:hidden;background:#171B35}h2{font-size:18px;margin:20px 20px 6px}section p{margin:0 20px 12px}canvas{display:block;width:100%;height:auto}button{float:right;border:1px solid #886C83;border-radius:20px;padding:10px 18px;background:#171B35;color:#F4DDB9}</style><header><button id="pause">일시정지</button><small>태엽 공장 · 실제 충돌 지형과 같은 동작</small><h1>돌리고, 우회하고, 두드리는 리듬</h1><p>표시등과 장애물은 같은 물리 시계를 사용합니다. 아래 화면은 세 구간의 장치 확대 미리보기입니다.</p></header><main><section><h2>01 6분할 회전 드럼</h2><p>원형 챔버 안의 여섯 날개가 공을 나눠 내보냅니다.</p><canvas id="drum" width="900" height="1120"></canvas></section><section><h2>02 분단 이송 구간</h2><p>타건 패드와 새 이송 패드를 거쳐 다음 드럼에 공급합니다.</p><canvas id="routes" width="900" height="1120"></canvas></section><section><h2>03 타건 피날레</h2><p>마지막 드럼과 위아래로 움직이는 패드를 통과합니다.</p><canvas id="finale" width="900" height="1120"></canvas></section></main><script src="../../js/maps.js"></script><script src="../../js/map-registry.js"></script><script src="../../js/maps/rhythm.js"></script><script src="../../js/maps/rhythm-style.js"></script><script src="../../js/physics.js"></script><script src="../../js/themes.js"></script><script src="../../js/renderer.js"></script><script>
const P=CosmicPinball,map=P.MAPS.rhythm,p=new P.Physics({map,names:P.parseNames('공')});let paused=false,elapsed=0,previous=0;document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'재생':'일시정지'};
function frame(ms){if(previous&&!paused)elapsed+=(ms-previous)/1000;previous=ms;p.time=elapsed;
 for(const[id,top]of [['drum',1100],['routes',2400],['finale',9550]]){const c=document.getElementById(id),ctx=c.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.translate(25,15);ctx.scale(.85,.85);ctx.translate(0,-top);const r=Object.assign(Object.create(P.Renderer.prototype),{ctx,mapStyle:P.MAP_STYLES.rhythm,theme:P.THEMES.cosmic,reducedMotion:false,quality:'high'});ctx.save();ctx.translate(0,top);r.mapPattern(ctx,1000,1400,true);ctx.restore();ctx.strokeStyle='#886C83';ctx.lineWidth=3;for(const x of[36,964]){ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,top+1400);ctx.stroke();}for(const o of map.obstacles)r.drawObstacle(o,p,null,p.time,{top:top,bottom:top+1290});ctx.restore();}
 requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
